<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150" fill="none">

    <defs>

        <!-- Main Wax -->

        <radialGradient id="waxGradient" cx="50%" cy="35%" r="70%">

            <stop offset="0%" stop-color="#D97A86"></stop>

            <stop offset="55%" stop-color="#B85B67"></stop>

            <stop offset="100%" stop-color="#8F434E"></stop>

        </radialGradient>

        <!-- Highlight -->

        <radialGradient id="highlight" cx="30%" cy="25%" r="45%">

            <stop offset="0%" stop-color="white" stop-opacity=".65"></stop>

            <stop offset="100%" stop-color="white" stop-opacity="0"></stop>

        </radialGradient>

        <!-- Inner Shadow -->

        <filter id="shadow">

            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".22"></feDropShadow>

        </filter>

    </defs>

    <!-- Wax Body -->

    <path filter="url(#shadow)" fill="url(#waxGradient)" d="

M75 10

L92 16

L108 12

L122 24

L134 38

L138 55

L143 73

L137 90

L129 106

L116 121

L98 131

L75 140

L52 131

L34 121

L21 106

L13 90

L7 73

L12 55

L16 38

L28 24

L42 12

L58 16

Z

"></path>

    <!-- Shine -->

    <ellipse cx="55" cy="45" rx="24" ry="18" fill="url(#highlight)" opacity=".75"></ellipse>

    <!-- Small Reflection -->

    <circle cx="98" cy="58" r="5" fill="white" opacity=".12"></circle>

    <!-- Emboss Ring -->

    <circle cx="75" cy="75" r="42" stroke="#D98C96" stroke-opacity=".25" stroke-width="2"></circle>

    <!-- AJ -->

    <text x="75" y="88" text-anchor="middle" font-size="34" font-family="Cormorant Garamond" font-weight="700" fill="#FDECE7" letter-spacing="1">

AJ

    </text>

    <!-- Emboss Highlight -->

    <text x="74" y="87" text-anchor="middle" font-size="34" font-family="Cormorant Garamond" font-weight="700" fill="white" opacity=".18" letter-spacing="1">

AJ

    </text>

</svg>